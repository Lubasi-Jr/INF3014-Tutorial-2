<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.4/css/boxicons.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>BookMe</title>
  </head>
  <body style="background-color: #fbf8ef; min-height: 95vh; padding-top: 20px">
    <nav class="navbar">
      <div style="color: white" class="oxygen-regular">LU's BOOKS</div>
      <div>
        <ul class="tabs oxygen-regular">
          <li>
            <a class="links" style="color: white" href="index.html">Home</a>
          </li>
          <li>
            <a class="links" style="color: white" href="books.html">Books</a>
          </li>
          <li>
            <a class="links" style="color: white" href="stationary.html"
              >Stationary</a
            >
          </li>
          <li>
            <a class="links" style="color: white" href="accessories.html"
              >Accessories</a
            >
          </li>
          <li>
            <a class="links" style="color: white" href="about.html">About</a>
          </li>
          <li>
            <a class="links" style="color: #ffb433" href="contact.html"
              >Contact</a
            >
          </li>
        </ul>
      </div>
      <div style="color: white" class="oxygen-regular icon-box">
        <a href="cart.html"> <i class="bx bx-cart cart-icon"></i></a>
        <i class="bx bx-user profile-icon"></i>
      </div>
    </nav>
    <section class="container">
      <div class="contact-us">
        <h1 class="oxygen-regular" style="font-size: 3rem; margin-bottom: 40px">
          Contact Me
        </h1>

        <form class="contact-form">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            style="width: 480px"
            required
          />

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            style="width: 480px"
            required
          />

          <label for="message">Your Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            placeholder="Write your message here..."
            required
            style="width: 480px"
          ></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </body>
</html>
